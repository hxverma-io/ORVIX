<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | ORVIX</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .contact-form input, .contact-form textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #555;
            color: #fff;
            font-family: inherit;
            font-size: 1.1rem;
            padding: 1rem 0;
            margin-bottom: 1.5rem;
            outline: none;
        }
        .contact-form input::placeholder, .contact-form textarea::placeholder {
            color: #666;
        }
        .contact-form input:focus, .contact-form textarea:focus {
            border-bottom-color: #fff;
        }
    </style>
</head>
<body>
    <nav class="bento-nav">
        <div class="logo-container">
            <div class="dots-logo">
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <span class="logo-text">ORVIX</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="explore.html">Explore</a>
            <a href="team.html">Team</a>
            <a href="community.html">Community</a>
            <a href="contact.html" style="color: #fff; font-weight: 500;">Contact</a>
        </div>
        <a href="login.html" class="nav-btn">Get Started ↗</a>
    </nav>

    <main class="bento-main">
        <div class="bento-layout">
            
            <div class="bento-box bg-white title-box" style="grid-column: 1 / 3; grid-row: 1 / 2; padding: 3rem; justify-content: center;">
                <h1 style="font-size: 4rem; letter-spacing: -2px;">Let's build<br>something great.</h1>
            </div>

            <div class="bento-box bg-dark feature-box" style="grid-column: 3; grid-row: 1;">
                <h3>Email</h3>
                <p style="font-size: 1.1rem; color: #fff; margin-top: 0.5rem;">hello@orvix.tech</p>
                <p style="font-size: 1.1rem; color: #fff; margin-top: 0.5rem;">support@orvix.tech</p>
            </div>

            <div class="bento-box bg-black feature-box" style="grid-column: 4; grid-row: 1;">
                <h3>Headquarters</h3>
                <p style="font-size: 1.1rem; color: #fff; margin-top: 0.5rem;">San Francisco, CA</p>
                <p style="color: #888;">100 Tech Lane, Suite 400</p>
            </div>

            <div class="bento-box bg-black desc-box" style="grid-column: 1 / 4; grid-row: 2 / 4; padding: 4rem !important; align-items: flex-start; justify-content: flex-start;">
                <h2 style="font-size: 2.5rem; font-weight: 300; margin-bottom: 3rem;">Send us a message</h2>
                <form class="contact-form" style="width: 100%; max-width: 600px;">
                    <div style="display: flex; gap: 2rem;">
                        <input type="text" placeholder="Name" required>
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <input type="text" placeholder="Subject" required>
                    <textarea rows="3" placeholder="How can we help you?" required></textarea>
                    <button type="submit" class="get-started-btn" style="margin-top: 1rem; border: none; cursor: pointer;">Submit Message ↗</button>
                </form>
            </div>

            <div class="bento-box bg-white feature-box" style="grid-column: 4; grid-row: 2;">
                <h2 style="font-size: 2.5rem; margin-bottom: 0.5rem; color: #000; font-weight: 300;">24h</h2>
                <p style="color: #666;">Average response time for support queries.</p>
            </div>

            <div class="bento-box bg-black feature-box impact-box" style="grid-column: 4; grid-row: 3;">
                <div class="feature-icon">✦</div>
                <h3>Social</h3>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <a href="#" style="color: #fff; text-decoration: none;">Twitter</a>
                    <a href="#" style="color: #fff; text-decoration: none;">GitHub</a>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
