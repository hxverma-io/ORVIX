<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solve Problem | ORVIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Ace Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ext-language_tools.js" type="text/javascript" charset="utf-8"></script>
    
    <style>
        :root {
            --bg-base: #000000;
            --bg-surface: #09090b;
            --bg-editor: #18181b;
            --bg-hover: #1f1f22;
            
            --border-soft: #27272a;
            --border-hard: #3f3f46;
            
            --text-main: #ffffff;
            --text-body: #a1a1aa;
            --text-muted: #71717a;
            
            --accent-c: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { background: var(--bg-base); color: var(--text-body); height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: 'Inter', sans-serif; }
        h1, h2, h3, .brand-font { font-family: 'Outfit', sans-serif; }
        a { color: inherit; text-decoration: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* TOPBAR */
        .topbar { height: 60px; background: var(--bg-surface); border-bottom: 1px solid var(--border-soft); display: flex; justify-content: space-between; align-items: center; padding: 0 1.5rem; flex-shrink: 0; }
        .tb-left { display: flex; align-items: center; gap: 1rem; }
        .back-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: var(--bg-hover); color: var(--text-main); transition: all 0.2s; cursor: pointer; border: 1px solid var(--border-soft); }
        .back-btn:hover { background: var(--border-hard); }
        .prob-title { font-weight: 600; color: var(--text-main); font-size: 1.1rem; }
        
        .tb-right { display: flex; align-items: center; gap: 1rem; }
        .btn-run { background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--border-soft); padding: 0.5rem 1.2rem; border-radius: 8px; font-weight: 500; cursor: pointer; transition: all 0.2s; font-size: 0.85rem; }
        .btn-run:hover { background: rgba(255,255,255,0.1); }
        .btn-submit { background: var(--text-main); color: #000; border: none; padding: 0.5rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.85rem; }
        .btn-submit:hover { opacity: 0.9; box-shadow: 0 4px 12px rgba(255,255,255,0.2); }
        .btn-complete { display: none; background: var(--accent-green); color: #000; border: none; padding: 0.5rem 1.2rem; border-radius: 8px; font-weight: 700; cursor: pointer; animation: popIn 0.3s ease forwards; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); font-size: 0.85rem; }
        .btn-complete:hover { background: #059669; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* WORKSPACE */
        .workspace { flex: 1; display: flex; overflow: hidden; }

        /* LEFT PANE */
        .left-pane { width: 45%; background: var(--bg-base); border-right: 1px solid var(--border-soft); display: flex; flex-direction: column; overflow-y: auto; padding: 2.5rem; }
        .diff-badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-bottom: 1rem; letter-spacing: 0.5px; }
        .diff-Beginner { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.2); }
        .diff-Intermediate { background: rgba(245, 158, 11, 0.1); color: var(--accent-yellow); border: 1px solid rgba(245, 158, 11, 0.2); }
        .diff-Hard { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.2); }

        .desc-title { font-size: 1.8rem; font-weight: 700; color: var(--text-main); margin-bottom: 1.5rem; }
        .desc-text { font-size: 1rem; line-height: 1.7; color: var(--text-body); margin-bottom: 2.5rem; white-space: pre-wrap; }
        
        .example-box { background: rgba(255,255,255,0.02); border: 1px solid var(--border-soft); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .ex-title { font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .ex-text { font-family: 'Fira Code', monospace; font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }
        .ex-text strong { color: var(--text-main); font-weight: 500; }

        .constraints { margin-top: 2rem; background: rgba(255,255,255,0.01); border-left: 2px solid var(--border-hard); padding: 1rem 1.5rem; }
        .constraints h4 { color: var(--text-main); margin-bottom: 0.8rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .constraints ul { list-style-position: inside; color: var(--text-muted); font-size: 0.9rem; font-family: 'Fira Code', monospace; }

        /* RIGHT PANE */
        .right-pane { flex: 1; display: flex; flex-direction: column; background: var(--bg-editor); min-width: 0; }
        .editor-header { height: 45px; background: var(--bg-surface); border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; padding: 0 1rem; flex-shrink: 0; }
        .lang-badge { font-size: 0.8rem; font-weight: 500; color: var(--text-main); background: rgba(255,255,255,0.05); padding: 0.3rem 0.8rem; border-radius: 6px; border: 1px solid var(--border-soft); }
        .editor-wrapper { flex: 1; position: relative; }
        #editor { position: absolute; top: 0; bottom: 0; left: 0; right: 0; font-family: 'Fira Code', monospace !important; font-size: 15px; }

        /* OUTPUT PANE */
        .output-pane { height: 280px; background: var(--bg-base); border-top: 1px solid var(--border-soft); display: flex; flex-direction: column; flex-shrink: 0; }
        .output-header { height: 45px; background: var(--bg-surface); border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; padding: 0 1.5rem; gap: 1.5rem; flex-shrink: 0; }
        .out-tab { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); cursor: pointer; height: 100%; display: flex; align-items: center; border-bottom: 2px solid transparent; transition: color 0.2s; }
        .out-tab.active { color: var(--text-main); border-bottom-color: var(--text-main); font-weight: 600; }
        .output-content { flex: 1; padding: 1.5rem; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 0.9rem; color: var(--text-body); white-space: pre-wrap; line-height: 1.6; }
        
        .status-text { font-weight: 700; margin-bottom: 1.5rem; font-family: 'Outfit', sans-serif; font-size: 1.2rem; }
        .status-success { color: var(--accent-green); }
        .status-error { color: var(--accent-red); }
        
        /* TEST CASE UI */
        .test-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border-soft); border-radius: 12px; margin-bottom: 1rem; overflow: hidden; }
        .tc-header { padding: 0.8rem 1.2rem; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-soft); }
        .tc-header.success { color: var(--accent-green); }
        .tc-header.error { color: var(--accent-red); }
        .tc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; padding: 1.2rem; }
        .tc-box { display: flex; flex-direction: column; gap: 0.4rem; }
        .tc-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .tc-val { font-family: 'Fira Code', monospace; background: #000; padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border-hard); color: var(--text-main); font-size: 0.85rem; word-break: break-all; }
        .tc-val.error { border-color: rgba(239, 68, 68, 0.4); color: var(--accent-red); }
        .tc-val.compile-err { white-space: pre-wrap; color: var(--accent-red); font-size: 0.8rem; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <header class="topbar">
        <div class="tb-left">
            <a href="course_c.html?tab=practice" class="back-btn" title="Back to Practice">←</a>
            <div class="prob-title" id="ui-title">Loading...</div>
        </div>
        <div class="tb-right">
            <button class="btn-complete" id="btn-complete">Mark as Complete & Return</button>
            <button class="btn-run" id="btn-run">▶ Run Code</button>
            <button class="btn-submit" id="btn-submit">Submit Solution</button>
        </div>
    </header>

    <!-- WORKSPACE -->
    <div class="workspace">
        
        <!-- LEFT PANE -->
        <div class="left-pane">
            <div id="ui-diff" class="diff-badge"></div>
            <h1 class="desc-title" id="ui-desc-title">Loading...</h1>
            <div class="desc-text" id="ui-desc-text">
                Fetching problem from server...
            </div>
            
            <div id="ui-examples"></div>

            <div class="constraints" style="display:none;" id="con-wrap">
                <h4>Constraints</h4>
                <ul id="ui-constraints"></ul>
            </div>
        </div>

        <!-- RIGHT PANE -->
        <div class="right-pane">
            
            <div class="editor-header">
                <span class="lang-badge">C (GCC)</span>
            </div>
            
            <div class="editor-wrapper">
                <div id="editor"></div>
            </div>
            
            <div class="output-pane">
                <div class="output-header">
                    <div class="out-tab active">Test Results</div>
                </div>
                <div class="output-content" id="output-terminal">
                    Run your code to compile and view test results here.
                </div>
            </div>

        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pid = urlParams.get('id') || "1";
        let currentProb = null;

        // Ace Editor Setup
        ace.require("ace/ext/language_tools");
        const editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/c_cpp");
        editor.setOptions({
            enableBasicAutocompletion: true,
            enableLiveAutocompletion: true,
            showPrintMargin: false
        });

        // Initialize UI by fetching from API
        async function fetchProblem() {
            try {
                const res = await fetch(`/api/problems/${pid}`);
                if (!res.ok) throw new Error("Problem not found");
                currentProb = await res.json();

                document.title = `${currentProb.title} | ORVIX`;
                document.getElementById('ui-title').innerText = currentProb.title;
                document.getElementById('ui-desc-title').innerText = currentProb.title;
                
                const diffBadge = document.getElementById('ui-diff');
                diffBadge.innerText = currentProb.difficulty;
                diffBadge.className = 'diff-badge diff-' + currentProb.difficulty;
                
                document.getElementById('ui-desc-text').innerText = currentProb.desc;

                let exHTML = '';
                currentProb.examples.forEach((ex, i) => {
                    exHTML += `
                        <div class="example-box">
                            <div class="ex-title">Example ${i+1}</div>
                            <div class="ex-text">
                                <strong>Input:</strong><br> ${ex.input.replace(/\\n/g, '<br>')}<br><br>
                                <strong>Output:</strong><br> ${ex.output}<br>
                                ${ex.explain ? `<br><strong>Explanation:</strong> ${ex.explain}` : ''}
                            </div>
                        </div>
                    `;
                });
                document.getElementById('ui-examples').innerHTML = exHTML;

                if (currentProb.constraints && currentProb.constraints.length > 0) {
                    document.getElementById('con-wrap').style.display = 'block';
                    let conHTML = '';
                    currentProb.constraints.forEach(c => {
                        conHTML += `<li>${c}</li>`;
                    });
                    document.getElementById('ui-constraints').innerHTML = conHTML;
                }

                editor.setValue(currentProb.defaultCode, -1);

            } catch (e) {
                document.getElementById('ui-desc-text').innerHTML = `<span style="color:var(--accent-red)">Error loading problem. Make sure the server is running.</span>`;
            }
        }
        
        fetchProblem();

        // Execution Logic via secure API
        const btnRun = document.getElementById('btn-run');
        const btnSubmit = document.getElementById('btn-submit');
        const btnComplete = document.getElementById('btn-complete');
        const outTerminal = document.getElementById('output-terminal');

        function sanitizeError(errStr) {
            if (!errStr) return "";
            // Clean up container specific errors like chmod from Piston v1
            let clean = errStr.replace(/chmod: cannot access 'a\\.out': No such file or directory/g, '').trim();
            let lines = clean.split('\\n');
            let uniqueLines = [...new Set(lines)];
            return uniqueLines.join('\\n');
        }

        async function executeCode(isSubmit) {
            if (!currentProb) return;

            btnRun.disabled = true;
            btnSubmit.disabled = true;
            btnComplete.style.display = 'none';
            
            outTerminal.innerHTML = `<div style='color: var(--text-muted);'>${isSubmit ? 'Judging solution against all hidden cases...' : 'Compiling & running sample case securely...'}</div>`;

            const code = editor.getValue();
            const endpoint = isSubmit ? '/api/submit' : '/api/run';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, problemId: pid })
                });
                
                const data = await res.json();

                if (!res.ok) {
                    outTerminal.innerHTML = `<div class="status-text status-error">Server Error</div><div style="color:var(--accent-red)">${data.error || 'Unknown error'}</div>`;
                    btnRun.disabled = false;
                    btnSubmit.disabled = false;
                    return;
                }

                let resultsHTML = '';

                // Handle 'Run Code' (single response) vs 'Submit' (array of results)
                if (!isSubmit) {
                    const cleanErr = sanitizeError(data.stderr);
                    
                    if (cleanErr) {
                        outTerminal.innerHTML = `
                            <div class="status-text status-error">Compilation Failed ✗</div>
                            <div class="test-card">
                                <div class="tc-header error">Compilation Error</div>
                                <div class="tc-grid">
                                    <div class="tc-box" style="grid-column: 1 / -1;">
                                        <div class="tc-label">Details</div>
                                        <div class="tc-val compile-err">${cleanErr}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        const actualOut = data.stdout;
                        const expectedOut = data.expected;
                        const displayInput = data.input.replace(/\\n/g, '<br>');
                        
                        if (actualOut === expectedOut) {
                            outTerminal.innerHTML = `
                                <div class="status-text status-success">Sample Passed ✓</div>
                                <p style="color: var(--text-body); margin-bottom: 1.5rem;">Your code works for the sample test case. Click 'Submit' to check against all cases.</p>
                                <div class="test-card">
                                    <div class="tc-header success">Sample Case ✓</div>
                                    <div class="tc-grid">
                                        <div class="tc-box"><div class="tc-label">Input</div><div class="tc-val">${displayInput}</div></div>
                                        <div class="tc-box"><div class="tc-label">Expected</div><div class="tc-val">${expectedOut}</div></div>
                                        <div class="tc-box"><div class="tc-label">Your Output</div><div class="tc-val">${actualOut || '<span style="opacity:0.3;">(Empty)</span>'}</div></div>
                                    </div>
                                </div>
                            `;
                        } else {
                            outTerminal.innerHTML = `
                                <div class="status-text status-error">Wrong Answer ✗</div>
                                <p style="color: var(--text-body); margin-bottom: 1.5rem;">Your logic failed on the sample test case.</p>
                                <div class="test-card">
                                    <div class="tc-header error">Sample Case ✗</div>
                                    <div class="tc-grid">
                                        <div class="tc-box"><div class="tc-label">Input</div><div class="tc-val">${displayInput}</div></div>
                                        <div class="tc-box"><div class="tc-label">Expected</div><div class="tc-val">${expectedOut}</div></div>
                                        <div class="tc-box"><div class="tc-label">Your Output</div><div class="tc-val error">${actualOut || '<span style="opacity:0.3;">(Empty)</span>'}</div></div>
                                    </div>
                                </div>
                            `;
                        }
                    }
                } else {
                    // Handle 'Submit' results array
                    data.results.forEach(tc => {
                        const displayInput = tc.input.replace(/\\n/g, '<br>');
                        if (tc.status === "Compilation/Runtime Error") {
                            resultsHTML += `
                                <div class="test-card">
                                    <div class="tc-header error">Test Case ${tc.caseNumber} - ${tc.status}</div>
                                    <div class="tc-grid">
                                        <div class="tc-box" style="grid-column: 1 / -1;"><div class="tc-label">Error Details</div><div class="tc-val compile-err">${sanitizeError(tc.error)}</div></div>
                                    </div>
                                </div>`;
                        } else if (tc.status === "Passed") {
                            resultsHTML += `
                                <div class="test-card">
                                    <div class="tc-header success">Test Case ${tc.caseNumber} ✓</div>
                                    <div class="tc-grid">
                                        <div class="tc-box"><div class="tc-label">Input</div><div class="tc-val">${displayInput}</div></div>
                                        <div class="tc-box"><div class="tc-label">Expected</div><div class="tc-val">${tc.expected}</div></div>
                                        <div class="tc-box"><div class="tc-label">Your Output</div><div class="tc-val">${tc.output || '<span style="opacity:0.3;">(Empty)</span>'}</div></div>
                                    </div>
                                </div>`;
                        } else {
                            resultsHTML += `
                                <div class="test-card">
                                    <div class="tc-header error">Test Case ${tc.caseNumber} ✗</div>
                                    <div class="tc-grid">
                                        <div class="tc-box"><div class="tc-label">Input</div><div class="tc-val">${displayInput}</div></div>
                                        <div class="tc-box"><div class="tc-label">Expected</div><div class="tc-val">${tc.expected}</div></div>
                                        <div class="tc-box"><div class="tc-label">Your Output</div><div class="tc-val error">${tc.output || '<span style="opacity:0.3;">(Empty)</span>'}</div></div>
                                    </div>
                                </div>`;
                        }
                    });

                    if (data.verdict === "Accepted") {
                        outTerminal.innerHTML = `
                            <div class="status-text status-success">Accepted ✓</div>
                            <p style="color: var(--text-body); margin-bottom: 1.5rem;">Accuracy: 100%. All hidden test cases passed successfully.</p>
                            ${resultsHTML}
                        `;
                        btnComplete.style.display = 'block';
                    } else if (data.verdict === "Compilation Error") {
                        outTerminal.innerHTML = `
                            <div class="status-text status-error">Compilation Failed ✗</div>
                            <p style="color: var(--text-body); margin-bottom: 1.5rem;">Fix the syntax errors below to proceed.</p>
                            ${resultsHTML}
                        `;
                    } else {
                        outTerminal.innerHTML = `
                            <div class="status-text status-error">Wrong Answer ✗</div>
                            <p style="color: var(--text-body); margin-bottom: 1.5rem;">Your logic failed on a hidden test case.</p>
                            ${resultsHTML}
                        `;
                    }
                }

            } catch (err) {
                outTerminal.innerHTML = `<div class="status-text status-error">Execution API Unreachable. Check Backend Server.</div>`;
            }

            btnRun.disabled = false;
            btnSubmit.disabled = false;
        }

        btnRun.addEventListener('click', () => executeCode(false));
        btnSubmit.addEventListener('click', () => executeCode(true));
        
        // Handle Complete Action
        btnComplete.addEventListener('click', () => {
            let solved = localStorage.getItem('solved_problems');
            solved = solved ? JSON.parse(solved) : [];
            
            if (!solved.includes(pid)) {
                solved.push(pid);
                localStorage.setItem('solved_problems', JSON.stringify(solved));
            }
            window.location.href = 'course_c.html?tab=practice';
        });
    </script>
</body>
</html>
